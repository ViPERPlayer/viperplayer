name: Portable runtime prototype

on:
  push:
    branches: [prototype/portable-quickjs-youtube]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle -p portable-plugin-core/standalone :portable-plugin-core:test
